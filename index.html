<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>asanalidev.погода</title>
    <link rel="stylesheet" href="style.css">
    <!-- ㍿ -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="weather-container">
        <!-- ㍿ -->
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Введите город (например, Астана)...">
            <button id="searchBtn">
                <span class="material-symbols-outlined">search</span>
            </button>
            <button id="geoBtn" title="Определить мое местоположение">
                <span class="material-symbols-outlined">my_location</span>
            </button>
        </div>

        <!-- ㍿ -->
        <div id="errorMsg" class="error-msg hidden">Город не найден. Проверьте написание!</div>

        <!-- ㍿ -->
        <div class="weather-info" id="weatherInfo">
            <div class="location-date">
                <h2 id="cityName">Загрузка...</h2>
                <p id="currentDate">Сегодня</p>
            </div>

            <div class="temperature-section">
                <div class="weather-icon" id="weatherIcon">⛅</div>
                <div class="temp-value"><span id="temp">--</span>°C</div>
            </div>

            <div class="weather-description" id="weatherDesc">Определение погоды...</div>

            <!-- ㍿ -->
            <div class="weather-details">
                <div class="detail-item">
                    <span class="material-symbols-outlined">air</span>
                    <div>
                        <p>Ветер</p>
                        <strong id="windSpeed">-- м/с</strong>
                    </div>
                </div>
                <div class="detail-item">
                    <span class="material-symbols-outlined">humidity_percentage</span>
                    <div>
                        <p>Влажность</p>
                        <strong id="humidity">--%</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
